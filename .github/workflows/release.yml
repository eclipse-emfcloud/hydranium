name: Release

# `workflow_dispatch` is not a convenience. The placeholder guard that used to
# make an accidental run harmless is gone with the `0.0.0` versions it read, so
# a deliberate trigger is what replaces it — and the bootstrap publish, which
# has to happen once before any package has a trusted publisher to authenticate
# against, has no other way to be invoked.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

defaults:
  run:
    shell: bash

# `contents: read`, not write. Nothing here commits, tags or cuts a GitHub
# release any more — the version is stamped in the runner's tree and thrown
# away — so write access would be a grant this job has no use for, in the one
# job that also holds `id-token: write`.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    # This job runs the same `npm run build:all` as CI, so it needs the same
    # build environment; CI compares the two files and reddens if they diverge.
    #
    # There is deliberately NO NODE_AUTH_TOKEN here. Publishing authenticates
    # through OIDC (see the preflight below), and npm only reaches for OIDC when
    # it finds no usable token first — so a token in the environment does not
    # add a fallback, it silently takes precedence and the trusted-publisher
    # path is never exercised.
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      TURBO_UI: stream
      FORCE_COLOR: 1

    steps:
      # SHA-pinned, not tag-pinned; see the twin step in ci.yml. It matters most
      # in this file: a mutable major tag on an action running in a job that
      # holds `id-token: write` is a standing grant to mint a publish credential
      # for whatever that tag is later moved to.
      #
      # `fetch-depth: 0` is load-bearing rather than cautious — the rolling
      # version counts commits since the last release tag, and a shallow clone
      # resolves no tag at all.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # No `registry-url`, and that is required rather than an omission. Given
      # one, setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into an .npmrc and points NPM_CONFIG_USERCONFIG at it for every step.
      # With no token in the environment that expands to an EMPTY token, which
      # npm treats as a credential it should use — so it never attempts the OIDC
      # exchange and the publish fails with ENEEDAUTH, or with a 404 that is
      # really a 403. Omitting the input leaves npm on its default registry,
      # which is the same registry, with nothing written into an .npmrc.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # setup-node does not act on `packageManager`; see the twin step in
      # ci.yml. Kept textually identical to it so the two toolchains cannot
      # diverge, and derived from the manifest so neither can fall behind a
      # bump to the pin.
      - name: Pin the toolchain
        run: |
          pinned=$(node -e "
            const { packageManager } = require('./package.json');
            if (typeof packageManager !== 'string' || !packageManager.startsWith('npm@')) {
              console.error('Root packageManager is not an npm pin: ' + packageManager);
              process.exit(1);
            }
            console.log(packageManager.slice(4));
          ")
          npm install -g "npm@$pinned" --no-fund --no-audit
          if [ "$(npm --version)" != "$pinned" ]; then
            echo "npm $(npm --version) is first on PATH, but package.json pins npm@$pinned." >&2
            exit 1
          fi
          node -e "
            const engines = require('./package.json').engines.node;
            if (!engines.startsWith('>=')) {
              console.error('engines.node is ' + engines + '; this check understands only a >=x.y[.z] floor.');
              process.exit(1);
            }
            const pad = (version) => (version + '.0.0').split('.').slice(0, 3);
            const rank = (version) => pad(version).reduce((acc, part) => acc * 1000 + Number(part), 0);
            if (rank(process.versions.node) < rank(engines.slice(2).trim())) {
              console.error('Node ' + process.versions.node + ' does not satisfy engines.node ' + engines + '.');
              process.exit(1);
            }
          "

      # The publish is the LAST step, so by the time npm first speaks to the
      # registry the whole graph has been built and gated. These three questions
      # are asked here instead, where failing costs seconds — and each has
      # actually been observed to fail silently rather than loudly.
      #
      # `npm whoami` is deliberately NOT among them: it exercises token
      # authentication, which this workflow no longer uses, so under OIDC it
      # fails on a correctly configured runner and proves nothing on a broken
      # one. There is no cheap probe for "trusted publishing is configured for
      # this package" — npm does not validate a publisher configuration when it
      # is saved, and the first real signal is the publish itself.
      - name: Preflight the publish environment
        run: |
          npm_version=$(npm --version)
          node -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number);
            const rank = (major * 1e6) + (minor * 1e3) + patch;
            if (rank < (11 * 1e6) + (5 * 1e3) + 1) {
              console.error('npm ' + process.argv[1] + ' predates 11.5.1 and will not attempt the OIDC exchange.');
              process.exit(1);
            }
          " "$npm_version"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "No OIDC token endpoint in the environment, so this job cannot mint a" >&2
            echo "publish credential. The job needs 'id-token: write'." >&2
            exit 1
          fi
          # An _authToken reaching npm from any .npmrc takes precedence over
          # OIDC, so a publish would quietly authenticate as something other
          # than this workflow — or, with the token empty, not at all.
          if npm config get //registry.npmjs.org/:_authToken 2>/dev/null | grep -qv '^undefined$'; then
            echo "An npm _authToken is configured. It would take precedence over OIDC," >&2
            echo "so the trusted-publisher path would never run." >&2
            exit 1
          fi

      # Every guard above runs before the install and the build, so a run that
      # cannot possibly reach a good publish fails in seconds rather than after
      # the full graph has been built.
      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      # `lib/` is build output and is not committed, so `packages/cli/lib/cli.js`
      # is absent when `npm ci` runs and npm SILENTLY skips a workspace `bin`
      # symlink whose target is missing. The first example to invoke
      # `hydranium-cli` in its `generate` step then dies with exit 127, naming
      # that example rather than the link that was never made — so the failure
      # points at the example's grammar tooling and not at the install.
      #
      # Building first gives the symlink a target; the second install is what
      # creates it. It cannot be collapsed into one step: npm offers no hook
      # between dependency installation and workspace `prepare`, which is why
      # the two-step is permanent rather than a bug awaiting a fix.
      # `tsc -b`, and NOT a filtered turbo run, which was tried and measured
      # worse: the `build:all` behind this one still reported `0 cached` — the
      # install between them changes what turbo hashes — so nothing was reused
      # and the step itself went 12s to 31s on turbo's overhead alone. Whatever
      # this step costs is paid twice by construction; keep it the cheap one.
      - name: Build the framework packages
        run: npm run build

      - name: Link the workspace bins
        run: npm install --no-fund --no-audit

      - name: Build
        run: npm run build:all

      # The whole contributor gate, in THIS workflow, before the publish step.
      # The alternatives were weighed and rejected: `workflow_run` resolves the
      # workflow file from the default branch rather than the pushed commit and
      # needs its own conclusion check, so a CI run that was skipped or
      # cancelled silently blocks every release; and folding this job into
      # ci.yml with `needs:` rewrites both files to buy the same property.
      # Nothing else can supply it — CI runs on the same trigger with no
      # dependency either way, so the two RACE, and a red gate over there
      # cannot stop what happens below. The duplicated run is cheap: the build
      # above populates the turbo cache this reuses.
      - name: Full gate
        run: npm run check

      # The version is derived and stamped HERE, in a throwaway tree, and is
      # never committed. That is what keeps `package-lock.json` honest: a
      # committed version bump leaves the lockfile describing versions that do
      # not exist anywhere until someone remembers to reinstall, and the
      # mismatch is invisible until the next install fails.
      #
      # `NPM_CONFIG_PROVENANCE` is not set. Under OIDC npm attaches provenance
      # by itself, and setting it would make a run that has quietly fallen back
      # to some other credential still LOOK provenanced in the log while
      # attaching nothing. Read the registry page, not this file.
      #
      # The script owns the dist-tag rather than taking it from here: before the
      # first stable release `latest` has to track the newest prerelease, and
      # after it `latest` belongs to the stable line. Deriving that from the
      # registry means no one has to remember to change a flag on the day it
      # stops being true. See docs/contributing/releasing.md.
      - name: Publish
        run: node scripts/release.mjs next

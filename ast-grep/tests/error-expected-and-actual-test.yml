id: error-expected-and-actual
valid:
  - 'class ConflictError extends ResponseError { get baseVersion() { return 1; } get actualVersion() { return 2; } }'
  - 'class OnlyExpected extends Error { readonly expected = 1; }'
  - 'class OnlyActual { constructor(public actual: number) {} }'
  - 'interface Spec { expected: string; actual: string; }'
  - 'class PlainParameters { constructor(expected: number, actual: number) {} }'
  - 'class Sub extends Base { actual = 2; }'
invalid:
  - 'class Mismatch extends Error { get expected() { return 1; } get actual() { return 2; } }'
  - 'class Fields extends Error { readonly expected: string; actual?: string; }'
  - 'class Parameters { constructor(public expected: number, private readonly actual: number) {} }'
  - 'class Mixed extends ResponseError { readonly expected = 1; constructor(readonly actual: number) { super(); } }'
  - 'class NoHeritage { expected = 1; actual = 2; }'
  - 'class Quoted extends Error { "expected" = 1; get actual() { return 2; } }'
  - 'class Computed extends Error { ["expected"] = 1; ["actual"] = 2; }'
  - 'class ComputedGetter extends Error { get ["expected"]() { return 1; } get actual() { return 2; } }'
  - 'class Setters extends Error { set expected(value: number) {} set actual(value: number) {} }'
  - 'const Expression = class { expected = 1; actual = 2; };'
  - 'abstract class Abstract extends Error { abstract get expected(): number; abstract get actual(): number; }'
  - 'class Template extends Error { [`expected`] = 1; [`actual`] = 2; }'
  - 'class Declared extends Error { declare expected: number; declare actual: number; }'
  - 'class Accessors extends Error { accessor expected = 1; accessor actual = 2; }'
  - 'class Modifiers extends Error { public expected = 1; protected actual = 2; }'

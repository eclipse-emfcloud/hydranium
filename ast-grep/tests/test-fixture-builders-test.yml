id: test-fixture-builder-function
valid:
  - 'function makeSomethingElse(): void {}'
  - 'const fakeNode = makeFakeAstNode();'
invalid:
  - 'function fakeNode(): void {}'
  - 'export function makeNoopLogger(): void {}'
  - 'function* makeNode(): Generator<number> {}'
---
id: test-fixture-builder-variable
valid:
  - 'const makeSomethingElse = (): void => {};'
  - 'const fakeNode = makeFakeAstNode();'
invalid:
  - 'const makeNoopLogger = (): void => {};'
  - 'const fakeReflection = function (): void {};'

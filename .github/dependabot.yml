version: 2
updates:
  # No npm entry: langium, vscode-jsonrpc and vscode-languageserver-protocol
  # have coordinated pins across manifests and CLI scaffolds. Only langium
  # is a root override; a per-package bump of one link breaks the chain.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

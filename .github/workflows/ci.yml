name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A branch with no open pull request matches neither trigger above, so this
  # is the only way to run the gate on one.
  #
  # Every input exists to vary one knob across repeated runs of the SAME commit,
  # which is what separates a flaky leg from a broken change. Each is empty or
  # false on a push and a pull request, so none can alter what those runs do.
  workflow_dispatch:
    inputs:
      turbo_concurrency:
        description: 'Task concurrency cap: an integer >= 1, or a percentage like 50%'
        type: string
      skip_e2e:
        description: 'Skip the e2e job'
        type: boolean
        default: false
      # Caching `node_modules` costs the one thing `npm ci` was buying that the
      # npm cache was not: proof that a from-scratch install still works on this
      # platform. Nothing else in the repository exercises that, so it needs an
      # invocation of its own rather than a note asking someone to remember.
      # Run it after any dependency change that a cache hit would have hidden.
      skip_node_modules_cache:
        description: 'Install from scratch, ignoring the node_modules cache'
        type: boolean
        default: false
      vitest_max_workers:
        description: 'Vitest workers per package: an integer >= 1. Empty uses the configured CI default'
        type: string

# A superseded pull-request run is worthless, so cancel it; a superseded
# push-to-main run is the ONLY signal that commit will ever get, so queue it
# instead. Grouping on `github.ref` keeps the two branches of that rule from
# ever sharing a group: a pull request is `refs/pull/N/merge`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow clones, installs and runs gates. It writes nothing back — no
# comment, no status, no release — so `contents: read` is the whole
# requirement, and a top-level block sets every scope it omits to `none`.
# Narrower than the repository default, which a maintainer can set to
# read-write for every workflow at once.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A backstop, not a target. Windows runs the same gate appreciably slower
    # than Linux, so a ceiling tuned to Linux would cancel a healthy Windows run
    # and report it as a failure of the change under test.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # Windows earns its place on a language-server framework rather than as
        # generic coverage, on two axes. Path spelling, drive letters and
        # `file://` URI construction are where this stack diverges, and identity
        # comparisons on `URI` fail silently when it does. Child-process startup
        # and per-file cost are where it is SLOWER, so a boot or handshake budget
        # tuned to Linux expires here and reports the code under test rather than
        # the budget. `.gitattributes` pins every text file to LF on checkout, so
        # the byte-exact gates compare the same bytes on both — without that this
        # matrix would redden on line endings alone and say nothing about the code.
        #
        # The Windows image is pinned rather than `windows-latest`, which is a
        # moving alias: it advances a major Windows Server release under the
        # workflow, and a leg whose runtime and failure rate both move on someone
        # else's schedule cannot be measured against a change made here.
        os: [ubuntu-22.04, windows-2025]

    env:
      # `--report-on-fatalerror` makes a V8 fatal error drop a report naming
      # the trigger and the heap and system memory at that moment, which is
      # the evidence the silent Windows death currently leaves none of. Also
      # in `release.yml`, because the step above compares the two.
      #
      # `--trace-exit` belongs with it and is deliberately NOT here: it fires
      # on a SUCCESSFUL `process.exit(0)` too, and tsc calls one, so job-wide
      # it puts a WARNING and a stack trace on every green typecheck. It is
      # set on the failure-path re-run below instead.
      NODE_OPTIONS: --max_old_space_size=4096 --report-on-fatalerror
      TURBO_UI: stream
      FORCE_COLOR: 1
      # Empty is what turbo reads as unset, so a push and a pull request keep
      # its default and only a dispatch that fills the input caps anything.
      TURBO_CONCURRENCY: ${{ inputs.turbo_concurrency }}
      # Same shape, one layer down: turbo's cap is on TASKS and this one is on
      # the workers inside each task, and the product of the two is what the
      # runner's four cores actually see. `vitest.shared.ts` treats empty as
      # unset and applies its own CI default.
      VITEST_MAX_WORKERS: ${{ inputs.vitest_max_workers }}

    steps:
      # SHA-pinned, not tag-pinned: a major tag is mutable, so pinning to one is
      # a standing grant to run whatever it is later moved to. The trailing
      # comment carries the human-readable release, without which a reviewer
      # cannot tell an intended bump from a substitution.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because a gate that resolves commit SHAs cited in
          # documentation against git cannot do so under the default shallow
          # clone. It is designed to WARN rather than fail on a SHA it cannot
          # resolve, so that it stays usable in a fresh clone — which means a
          # shallow checkout turns it into a silent no-op rather than a red.
          fetch-depth: 0

      # Both workflows run the same `npm run build:all` against the same
      # toolchain, so anything that differs between them is drift, not a
      # decision. Compared rather than duplicated so it fires in BOTH
      # directions: change or drop either key in either file without the other
      # and this reddens here, on a pull request, where it costs nothing. The
      # same divergence discovered in release.yml lands after the version PR
      # has merged and the tags are cut.
      #
      # This and the gate-ordering check below read the workflow FILES, so their
      # verdict cannot vary by runner. Pinned to one leg of the matrix so a
      # future divergence is reported once rather than once per platform.
      - name: Release workflow carries the same build environment
        if: matrix.os == 'ubuntu-22.04'
        run: |
          compare() {
            key="$1"
            # DEDUPED, because this file declares more than one job and each
            # sets the same keys: without `sort -u` the comparison is two
            # identical lines against one, which differ as strings and would
            # report a divergence that does not exist. Distinct values still
            # survive dedup and still differ, which is the case it must catch.
            from_ci=$(sed -n "s/^ *$key: *//p" .github/workflows/ci.yml | sort -u)
            from_release=$(sed -n "s/^ *$key: *//p" .github/workflows/release.yml | sort -u)
            # Two absent keys compare EQUAL, so renaming or deleting one on both
            # sides turns this into a check that passes while reading nothing.
            # That is the only failure mode a comparison cannot report itself.
            if [ -z "$from_ci" ] && [ -z "$from_release" ]; then
              echo "$key is set in neither workflow, so comparing it checks nothing." >&2
              return 1
            fi
            if [ "$from_ci" != "$from_release" ]; then
              echo "$key differs between the two workflows:" >&2
              echo "  ci.yml:      ${from_ci:-<unset>}" >&2
              echo "  release.yml: ${from_release:-<unset>}" >&2
              return 1
            fi
          }
          compare node-version-file
          compare NODE_OPTIONS

      # The release workflow gates itself, in its own file, because the two
      # workflows share a `push: main` trigger with no dependency between them —
      # so a red gate here cannot stop a publish and need not even finish
      # first. Nothing but this assertion keeps that step in place, and a
      # publish that has LOST its gate is indistinguishable from one that never
      # had it until a bad version is on the registry, which npm does not let
      # you take back. Line numbers are compared because order is the property:
      # a gate after the publish is not a gate.
      - name: Release workflow gates itself before publishing
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # awk rather than a `grep | head` pipeline: a non-matching grep under
          # `pipefail` aborts the step at the assignment, so the very case this
          # exists to report would fail with no message at all. `index` keeps
          # the match a fixed string, and awk exits 0 with nothing on stdout.
          locate() {
            awk -v needle="$1" 'index($0, needle) { print NR; exit }' .github/workflows/release.yml
          }
          gate=$(locate 'run: npm run check')
          publish=$(locate 'run: node scripts/release.mjs')
          if [ -z "$gate" ]; then
            echo "release.yml no longer runs the full gate: its publish path is ungated." >&2
            exit 1
          fi
          if [ -z "$publish" ]; then
            echo "release.yml no longer invokes scripts/release.mjs, so this check cannot" >&2
            echo "locate the publish step it is asserting against." >&2
            exit 1
          fi
          if [ "$gate" -ge "$publish" ]; then
            echo "release.yml runs the gate at line $gate, not before the publish at line $publish." >&2
            exit 1
          fi

      # Read from `.nvmrc` rather than stated here, so one edit moves both
      # workflows and a local `nvm use` together. A version literal repeated in
      # three places is three chances to satisfy `engines.node` by coincidence:
      # a major-only spec is a semver RANGE, and it clears the floor only for as
      # long as the newest release in that major happens to be above it.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # A dispatch's inputs reach no API response and no log, so a run cannot
      # otherwise be told apart from one that took the defaults — and a knob
      # that silently failed to apply reads exactly like a knob that did not
      # help, which makes every measurement taken with it uninterpretable.
      # Each figure is read from what is IN FORCE rather than from what was
      # asked for: the variable turbo consults, and the heap ceiling V8 reports,
      # which is the one that binds whether or not NODE_OPTIONS moved it.
      #
      # After `Setup Node`, and that is the whole reason it is not the job's
      # first step: earlier it would measure the runner's preinstalled Node, and
      # V8 derives its default ceiling from physical memory per version, so the
      # figure would describe a process the build never runs.
      #
      # Through `tee`, because the summary renders for a reader while the log is
      # the only copy an API can retrieve, and a figure nobody can read back is
      # not a measurement. The machine sits beside the knobs because the two are
      # only meaningful together: the ceiling is PER PROCESS and turbo runs many.
      #
      # The ceiling is reported TWICE, with NODE_OPTIONS and without. V8 derives
      # its own from physical memory, and these runners sit just under the 16 GB
      # boundary its flag documentation names — so the pair is what says whether
      # the cap raises the ceiling, matches it, or lowers it. Either figure alone
      # invites the reader to assume one of the three.
      #
      # The vitest cap is the one figure here reported as REQUESTED rather than
      # as in force, because the value that binds is computed in
      # `vitest.shared.ts` and this step runs before the install that would let
      # anything read it. The two cannot silently diverge even so: an empty
      # request means the config's own default, and a request the config cannot
      # parse throws at startup rather than falling back — so there is no state
      # in which a number was asked for, ignored, and reported as applied.
      - name: Record the effective build knobs
        run: |
          {
            echo "### Build knobs (${{ matrix.os }})"
            echo "- turbo concurrency: \`${TURBO_CONCURRENCY:-turbo default}\`"
            echo "- vitest workers per package, requested: \`${VITEST_MAX_WORKERS:-config default}\`"
            echo "- node heap cap: \`${NODE_OPTIONS:-unset}\`"
            node -e 'const os = require("node:os"), v8 = require("node:v8"); const gib = (bytes) => (bytes / 2 ** 30).toFixed(2); console.log("- node: `" + process.version + "`"); console.log("- effective heap limit: `" + gib(v8.getHeapStatistics().heap_size_limit) + " GiB`"); console.log("- cpus: `" + os.cpus().length + "`"); console.log("- total memory: `" + gib(os.totalmem()) + " GiB`");'
            env -u NODE_OPTIONS node -e 'console.log("- heap limit without the cap: `" + (require("node:v8").getHeapStatistics().heap_size_limit / 2 ** 30).toFixed(2) + " GiB`");' || echo "- heap limit without the cap: \`unavailable\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # setup-node does not INSTALL `packageManager`'s version: it reads the
      # field only to pick which package manager's cache to restore, never as a
      # version to install. Without this step CI runs whatever npm ships inside
      # the Node image and the pin is decorative.
      # The version is read out of the manifest rather than repeated here, so a
      # bump to `packageManager` cannot leave the workflow behind.
      #
      # The two assertions are the point. A global install that lands off the
      # front of PATH leaves the pin silently unapplied; and the Node the runner
      # resolved is asserted against `engines.node` rather than trusted, because
      # the version file is a spec and not a guarantee — whoever edits it is
      # free to widen it back below the floor. Both otherwise surface much later
      # as an unrelated error.
      - name: Pin the toolchain
        run: |
          pinned=$(node -e "
            const { packageManager } = require('./package.json');
            if (typeof packageManager !== 'string' || !packageManager.startsWith('npm@')) {
              console.error('Root packageManager is not an npm pin: ' + packageManager);
              process.exit(1);
            }
            console.log(packageManager.slice(4));
          ")
          npm install -g "npm@$pinned" --no-fund --no-audit
          if [ "$(npm --version)" != "$pinned" ]; then
            echo "npm $(npm --version) is first on PATH, but package.json pins npm@$pinned." >&2
            exit 1
          fi
          node -e "
            const engines = require('./package.json').engines.node;
            if (!engines.startsWith('>=')) {
              console.error('engines.node is ' + engines + '; this check understands only a >=x.y[.z] floor.');
              process.exit(1);
            }
            const pad = (version) => (version + '.0.0').split('.').slice(0, 3);
            const rank = (version) => pad(version).reduce((acc, part) => acc * 1000 + Number(part), 0);
            if (rank(process.versions.node) < rank(engines.slice(2).trim())) {
              console.error('Node ' + process.versions.node + ' does not satisfy engines.node ' + engines + '.');
              process.exit(1);
            }
          "

      # `node_modules`, not `~/.npm`, which setup-node already caches above and
      # which already hits: 146 MB restored in 5s, after which npm still reports
      # `added 1678 packages in 3m`. So the cost is not fetching anything, it is
      # materialising 63,218 files — and that is why it is a Windows problem,
      # where `npm ci` runs 182–521s (median ~211 over 17 samples) against
      # Ubuntu's steady 35–40s.
      #
      # `restore` and `save` as separate steps rather than `actions/cache`,
      # which saves from a post-step that runs however the job ended. A job that
      # died midway through installing would publish a half-materialised tree
      # under a key every later run then hits, and nothing downstream would
      # report it as a cache problem. Saving explicitly, immediately after the
      # install and link have both succeeded, is what makes that impossible.
      #
      # The key carries the OS and the arch because `node_modules` holds
      # compiled binaries and actions/cache does NOT namespace by runner: one
      # shared key hands Windows a Linux tree. `.nvmrc` joins them because a
      # Node major re-ABIs every native module, and `patches/**` because
      # `patch-package` runs from `postinstall` and MUTATES the installed tree,
      # so a restored tree carries whichever patches were current when it was
      # saved.
      #
      # No `restore-keys`. A prefix match would restore a tree resolved from a
      # different lockfile, which is worse than installing rather than a
      # cheaper version of it.
      - name: Restore node_modules
        id: node-modules-cache
        if: ${{ !inputs.skip_node_modules_cache }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # `examples/*/*/node_modules`, two deep: every example is
          # `examples/<example>/<package>`, and a `*` does not cross a
          # separator, so the one-deep spelling matches nothing at all and
          # would say so by silently caching less.
          #
          # `.vite` is excluded deliberately. It is Vitest's dep-optimizer
          # prebundle, it is regenerated on demand, and it is the one directory
          # here whose corruption does not present as a cache problem — a bad
          # `deps_ssr` fails every suite in its package with a missing-module
          # error naming a dependency. Vite invalidates it correctly on its own
          # hashes, so this is not a staleness claim; it is that the payload is
          # pure churn and the failure it could import is expensive to read.
          path: |
            node_modules
            packages/*/node_modules
            examples/*/*/node_modules
            !**/node_modules/.vite
          key: ${{ runner.os }}-${{ runner.arch }}-node-modules-${{ hashFiles('.nvmrc', 'package-lock.json', 'patches/**') }}

      # A hit is not the same as a usable tree, and the gap is platform-shaped:
      # npm links workspaces with junctions on Windows and symlinks elsewhere,
      # and the two do not survive a tar round trip equally. So the restore is
      # verified rather than trusted — resolve a workspace link and a `.bin`
      # shim, and fall back to installing when either is broken.
      #
      # It never fails the job. A cache that cannot be used on some platform
      # should cost that platform the install it would have run anyway, not a
      # red build. But it says so in the summary, because the failure this
      # guards is otherwise invisible: the leg would quietly install every time
      # and read as a cache that simply never helps.
      - name: Check the restored tree is usable
        id: restored
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        run: |
          # The verdict is the EXIT STATUS, inside an `if`, so that the step
          # cannot fail the job under this shell's `-e` and so that a node that
          # crashed for some third reason counts as unusable and installs. A
          # command substitution would have done neither.
          usable=false
          if node -e "
            const { lstatSync, realpathSync } = require('node:fs');
            const { resolve } = require('node:path');
            // lstat, NEVER existsSync: the shim points into \`lib/\`, which the
            // build two steps below has not produced yet, so at this moment a
            // correctly restored shim is a DANGLING link and existsSync follows
            // it and answers false. That reads as an unusable cache on every
            // hit, and the leg would install every time while looking healthy.
            const present = path => lstatSync(path, { throwIfNoEntry: false }) !== undefined;
            const linked = realpathSync('node_modules/@hydranium/core');
            if (linked !== resolve('packages/core')) {
              throw new Error('workspace link resolves to ' + linked);
            }
            const shim = 'node_modules/.bin/hydranium-cli';
            if (!present(shim) && !present(shim + '.cmd')) {
              throw new Error('no hydranium-cli shim under node_modules/.bin');
            }
          "; then
            usable=true
          fi
          echo "usable=$usable" >> "$GITHUB_OUTPUT"
          echo "- node_modules cache: hit, restored tree usable: \`$usable\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        if: steps.restored.outputs.usable != 'true'
        run: npm ci --no-fund --no-audit

      # `lib/` is build output and is not committed, so `packages/cli/lib/cli.js`
      # is absent when `npm ci` runs and npm SILENTLY skips a workspace `bin`
      # symlink whose target is missing. The first example to invoke
      # `hydranium-cli` in its `generate` step then dies with exit 127, naming
      # that example rather than the link that was never made — so the failure
      # points at the example's grammar tooling and not at the install.
      #
      # Building first gives the symlink a target; the second install is what
      # creates it. It cannot be collapsed into one step: npm offers no hook
      # between dependency installation and workspace `prepare`, which is why
      # the two-step is permanent rather than a bug awaiting a fix.
      # `tsc -b`, and NOT a filtered turbo run, which was tried and measured
      # worse: the `build:all` behind this one still reported `0 cached` — the
      # install between them changes what turbo hashes — so nothing was reused
      # and the step itself went 12s to 31s on turbo's overhead alone. Whatever
      # this step costs is paid twice by construction; keep it the cheap one.
      - name: Build the framework packages
        run: npm run build

      # Skipped on a usable restore for the same reason the install above is:
      # the shims are inside `node_modules/.bin` and came back with it. They
      # dangle until the build above produces `lib/`, which is why this step
      # was second in the first place, and a restored shim is in exactly that
      # state — the check earlier asserts it EXISTS, and the build makes it
      # resolve.
      - name: Link the workspace bins
        if: steps.restored.outputs.usable != 'true'
        run: npm install --no-fund --no-audit

      # Saved here rather than from a post-step, so what lands under the key is
      # a tree that installed, built and linked. `success()` is redundant
      # against a failing earlier step and is stated anyway, because the
      # property it asserts — never publish a tree that did not work — is the
      # whole reason this is not `actions/cache`.
      #
      # BEFORE `build:all`, and that ordering is load-bearing rather than
      # incidental: turbo caches under `node_modules/.cache`, so saving after it
      # would put one runner's task cache under a key every later run restores.
      # A replayed turbo cache reports tasks as cached and logs them as passing
      # without executing anything, which is a false green in the step whose
      # entire job is verification. Nothing between the install and here writes
      # into `node_modules` — the framework build is `tsc -b` and emits to
      # `lib/`.
      #
      # Nothing to save on a hit: the key is already occupied and a second
      # reservation of it is the `Failed to save: Unable to reserve cache` the
      # Theia compatibility leg had to drop its own cache to be rid of. A hit
      # whose tree came back UNUSABLE is not repairable here either, because a
      # key is immutable once written — the summary line above is what reports
      # it, and changing the lockfile is what retires it.
      - name: Save node_modules
        if: ${{ success() && !inputs.skip_node_modules_cache && steps.node-modules-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            examples/*/*/node_modules
            !**/node_modules/.vite
          key: ${{ steps.node-modules-cache.outputs.cache-primary-key }}

      # Kept separate from the gate below so a plain compile failure is
      # distinguishable at a glance, and so the gate's own turbo clause reuses
      # this build from the local cache rather than repeating it.
      - name: Build
        run: npm run build:all

      # The whole contributor gate, not a subset. Running individual clauses
      # here let nine of them drift out of CI while the workflow still looked
      # like it was gating: an unmatched lint glob or a missing SPDX header
      # reddens locally and passed here.
      # Teed so the re-run step below can read which task turbo reported as
      # failed. `pipefail` is on for this shell, so the gate's own status
      # still decides the step.
      - name: Full gate
        run: npm run check 2>&1 | tee gate.log

      # Ask the dead task again, on its own, with its streams kept APART.
      #
      # Every occurrence so far has produced an exit code and no output, and
      # the two possibilities behind that need different fixes: a tool that
      # genuinely says nothing, or output going somewhere it is not read.
      # Under turbo both streams are merged into one pipe with sixty-five
      # other tasks; here the task has the machine to itself and writes to
      # files, so whichever it is becomes visible.
      #
      # It answers the transience question in the same breath. A re-run that
      # passes says contention; one that fails identically says the state is
      # reproducible and can be chased.
      #
      # Both diagnostics are set HERE rather than on the gate, because both
      # are noisy when nothing is wrong: `--trace-exit` traces a successful
      # exit as readily as a failing one, and `DEBUG` adds thirty lines per
      # lint task across nineteen packages. This step only exists on a red
      # run, so neither costs a green one anything.
      #
      # Between them they cover both shapes seen so far: `--trace-exit` names
      # the caller when a tool exits explicitly, which tsc does, and `DEBUG`
      # traces eslint, which sets `process.exitCode` and returns instead.
      - name: Re-run the failed task with its streams apart
        if: failure()
        continue-on-error: true
        env:
          DEBUG: 'eslint:*'
        run: |
          # APPENDED to the job's value in the shell, not declared as a second
          # `NODE_OPTIONS:` key. A second key would be a second value for the
          # drift check above to compare against release.yml, and it would
          # fail — correctly, since it cannot tell a deliberate extra flag
          # from the environments diverging. Appending also means the base
          # flags are stated once.
          export NODE_OPTIONS="$NODE_OPTIONS --trace-exit"

          # Turbo colours its output, so the marker has to survive escape
          # codes being stripped before it can be matched.
          task=$(sed -e 's/\x1b\[[0-9;]*m//g' gate.log |
            awk '/^Failed:/ { print $2; exit }')
          if [ -z "$task" ]; then
            echo "No 'Failed:' line in the gate log; nothing to re-run." >&2
            exit 0
          fi
          package="${task%%#*}"
          script="${task##*#}"
          echo "re-running $script in $package"

          code=0
          npm run "$script" -w "$package" > rerun-stdout.log 2> rerun-stderr.log || code=$?

          {
            echo "### Re-run of \`$task\`"
            echo "- exit code: \`$code\` (0 means it passed the second time, so the first was transient)"
            echo "- stdout: \`$(wc -c < rerun-stdout.log)\` bytes"
            echo "- stderr: \`$(wc -c < rerun-stderr.log)\` bytes"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo '--- stdout (first 60 lines)'
          head -60 rerun-stdout.log
          echo '--- stderr (first 60 lines)'
          head -60 rerun-stderr.log

      # A turbo task that dies writing nothing leaves no failure to read. These
      # are the records that outlive it. `continue-on-error` because this runs
      # only when the job has already failed, and a second red would bury the
      # first. No live memory figure: by now the process has released it all.
      - name: Post-mortem for a silent child death
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($log in 'Application', 'System') {
            Write-Host "=== $log (last 30 minutes, Critical/Error/Warning) ==="
            $events = Get-WinEvent -ErrorAction SilentlyContinue -FilterHashtable @{
              LogName   = $log
              StartTime = (Get-Date).AddMinutes(-30)
              Level     = 1, 2, 3
            }
            if ($events) {
              $events | Select-Object -First 25 |
                Format-List TimeCreated, ProviderName, Id, LevelDisplayName, Message
            } else {
              Write-Host "no Critical/Error/Warning entries in the window"
            }
          }
          # The commit limit is what a Windows allocation fails against, and
          # unlike free memory it does not decay after the death.
          Write-Host "=== commit limit and pagefile ==="
          Get-CimInstance Win32_OperatingSystem |
            Format-List TotalVisibleMemorySize, TotalVirtualMemorySize
          Get-CimInstance Win32_PageFileUsage | Format-List Name, AllocatedBaseSize, PeakUsage

      # Separate from the upload below because it needs `include-hidden-files`,
      # which defaults to FALSE: turbo's logs are in a dot directory and would
      # be dropped in silence, leaving an artefact that looks complete.
      - name: Upload post-mortem evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-mortem-${{ matrix.os }}
          # Node writes its report into the dying process's working directory,
          # which under turbo is the task's own package, so every depth needs
          # naming — two for an example, because `*` does not cross a separator.
          # `gate.log` and the two re-run captures are at the root. Uploading
          # them matters more than it looks: GitHub REPLACES a job's log on
          # re-attempt, so an artefact is the only copy of the first failure
          # that survives someone hitting re-run.
          path: |
            gate.log
            rerun-stdout.log
            rerun-stderr.log
            report.*.json
            packages/*/report.*.json
            examples/*/*/report.*.json
            packages/*/.turbo/*.log
            examples/*/*/.turbo/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      # The one piece of this that a reader sees without downloading anything:
      # the artefact below is a zip, and GitHub renders no JUnit of its own. It
      # is a REPORTER, so it never fails the job — `always()` and it swallows
      # nothing but its own parsing.
      - name: Summarize test results
        if: always()
        run: node scripts/summarize-test-results.mjs

      # `always()`, because a report is worth most for the run that FAILED, and
      # a step conditioned on success uploads only the ones nobody needs to
      # read. The JUnit files carry a per-case duration, which is what turns
      # "which test is nearest the timeout" from a guess into a query.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            packages/*/test-results/
            examples/*/*/test-results/
            examples/*/*/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # A SEPARATE JOB rather than more steps on the one above, for two reasons.
  # It runs concurrently, and the e2e tiers took ~3m45s that used to wait behind
  # a 6m30s gate they do not depend on; and it reports as its own check, so a
  # browser failure is legible on the pull request without opening a log.
  #
  # The cost is honest: install and build run again here, about two minutes of
  # duplicated work, because jobs get separate runners with empty workspaces.
  # Wall clock still falls from roughly 12m20s to 8m35s.
  #
  # What is deliberately NOT split this way is the gate itself. Running its
  # clauses as separate steps or jobs is how nine of them once drifted out of
  # CI unnoticed, so `npm run check` stays one command in one job. The safe cut
  # is between the gate and e2e, not inside the gate.
  #
  # Ubuntu only, and that is now expressed by the job rather than by an `if:`
  # on every step: the browser and the Theia backend behave the same on both
  # platforms, so a second leg buys coverage of the runner rather than of the
  # code. The matrix above is what covers the platform differences that matter.
  e2e:
    name: e2e
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # Skippable ONLY from a dispatch, where the input exists: repeating a run to
    # measure the gate should not also repeat four minutes this job shares
    # nothing with. On a push or a pull request the input is empty and the job
    # runs, so no ordinary run can lose e2e coverage.
    if: ${{ inputs.skip_e2e != true }}

    env:
      NODE_OPTIONS: --max_old_space_size=4096 --report-on-fatalerror
      TURBO_UI: stream
      FORCE_COLOR: 1

    steps:
      # No `fetch-depth: 0` here, unlike the gate job: full history exists for
      # the commit-citation gate, which runs over there and not in this job.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      # The same two-step as the gate job, and for the same reason: `npm ci`
      # skips a workspace `bin` symlink whose target does not exist yet, so the
      # first example to invoke `hydranium-cli` dies with exit 127.
      - name: Build the framework packages
        run: npm run build

      - name: Link the workspace bins
        run: npm install --no-fund --no-audit

      - name: Build
        run: npm run build:all

      # `--with-deps` rather than the package's own `test:e2e:install`: the
      # shared runners carry no guarantee of Chromium's system libraries, and
      # the failure is a browser that will not launch rather than a missing one.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Each tier boots its own server through Playwright's `webServer`, which
      # sets `reuseExistingServer: false` under CI — so every run here is a COLD
      # start, the state a warm developer machine cannot reproduce and the one
      # where the startup handshakes actually fail.
      - name: Browser e2e
        run: npm run test:e2e -w @hydranium/example-order-flow-browser

      - name: Theia e2e
        run: npm run test:e2e -w @hydranium/example-order-flow-theia-app

      # Separated by the suite itself, at one worker: it kills and re-launches
      # the backend, so anything sharing the run would be racing a server that
      # is deliberately going away. `HYDRANIUM_PLAYWRIGHT_TIER` gives it its own
      # subdirectory of `test-results/`, because Playwright CLEARS that
      # directory on start and a shared one deletes the previous tier's report.
      - name: Theia e2e (restart tier)
        env:
          HYDRANIUM_PLAYWRIGHT_TIER: restart
        run: npm run test:e2e:restart -w @hydranium/example-order-flow-theia-app

      # Each job summarizes what its own workspace holds — the runners are
      # separate, so neither can see the other's reports. This one is therefore
      # the e2e durations, and the gate job's is the unit tiers.
      - name: Summarize test results
        if: always()
        run: node scripts/summarize-test-results.mjs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-e2e
          path: |
            examples/*/*/test-results/
            examples/*/*/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

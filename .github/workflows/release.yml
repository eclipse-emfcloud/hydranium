name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    # This job runs the same `npm run build:all` as CI, so it needs the same
    # build environment; CI compares the two files and reddens if they diverge.
    #
    # NODE_AUTH_TOKEN is job-level rather than on the publish step alone,
    # because setup-node's `registry-url` writes an .npmrc that reads it and
    # points NPM_CONFIG_USERCONFIG at that file for EVERY step — so every npm
    # invocation here, not just the publish, resolves its credentials through
    # it. Left unset, setup-node substitutes a dummy value and the failure is a
    # 401 from something that looks unrelated.
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      TURBO_UI: stream
      FORCE_COLOR: 1

    steps:
      # SHA-pinned, not tag-pinned; see the twin step in ci.yml. It matters most
      # in this file, where a step further down is handed NPM_TOKEN: a mutable
      # major tag is a standing grant to run whatever it is moved to, beside a
      # credential that can publish under the org's name.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # setup-node does not act on `packageManager`; see the twin step in
      # ci.yml. Kept textually identical to it so the two toolchains cannot
      # diverge, and derived from the manifest so neither can fall behind a
      # bump to the pin.
      - name: Pin the toolchain
        run: |
          pinned=$(node -e "
            const { packageManager } = require('./package.json');
            if (typeof packageManager !== 'string' || !packageManager.startsWith('npm@')) {
              console.error('Root packageManager is not an npm pin: ' + packageManager);
              process.exit(1);
            }
            console.log(packageManager.slice(4));
          ")
          npm install -g "npm@$pinned" --no-fund --no-audit
          if [ "$(npm --version)" != "$pinned" ]; then
            echo "npm $(npm --version) is first on PATH, but package.json pins npm@$pinned." >&2
            exit 1
          fi
          node -e "
            const engines = require('./package.json').engines.node;
            if (!engines.startsWith('>=')) {
              console.error('engines.node is ' + engines + '; this check understands only a >=x.y[.z] floor.');
              process.exit(1);
            }
            const pad = (version) => (version + '.0.0').split('.').slice(0, 3);
            const rank = (version) => pad(version).reduce((acc, part) => acc * 1000 + Number(part), 0);
            if (rank(process.versions.node) < rank(engines.slice(2).trim())) {
              console.error('Node ' + process.versions.node + ' does not satisfy engines.node ' + engines + '.');
              process.exit(1);
            }
          "

      # Everything irreversible in this job happens in its LAST step: the tags
      # are cut and the version PR is already merged by the time `changeset
      # publish` first speaks to the registry. So the credential question is
      # asked here instead, against the same .npmrc that publish will use,
      # while failing still costs nothing.
      #
      # It fires when NPM_TOKEN is absent, empty, expired or revoked, and also
      # when the token is fine but npm is not reading the file it was written
      # into — which is the one interaction this workflow could not otherwise
      # discover except by burning a release on it.
      - name: Preflight the npm credentials
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NODE_AUTH_TOKEN is empty: the NPM_TOKEN secret is unset on this repository." >&2
            exit 1
          fi
          if ! npm whoami --registry https://registry.npmjs.org; then
            echo "npm could not authenticate against registry.npmjs.org." >&2
            echo "Either NPM_TOKEN is invalid or expired, or the .npmrc npm read is not the" >&2
            echo "one actions/setup-node wrote from registry-url." >&2
            exit 1
          fi

      # With no changesets pending, changesets/action takes its PUBLISH path
      # rather than opening a version PR. Every package is still at the
      # placeholder 0.0.0 and none is on the registry, so the first push of a
      # fresh main would publish ten packages at 0.0.0 — burning both that
      # version and the names, neither of which npm lets you take back.
      #
      # This guard blocks only that state. A package at 0.0.0 is a placeholder
      # by definition, so refusing to publish it forecloses no intended
      # release; pick the real first version and the step passes.
      - name: Guard against publishing placeholder versions
        run: |
          placeholders=$(node -e "
            const fs = require('node:fs');
            const names = [];
            for (const dir of fs.readdirSync('packages')) {
              const manifest = 'packages/' + dir + '/package.json';
              if (!fs.existsSync(manifest)) continue;
              const parsed = JSON.parse(fs.readFileSync(manifest, 'utf-8'));
              if (parsed.private !== true && parsed.version === '0.0.0') names.push(parsed.name);
            }
            console.log(names.join(' '));
          ")
          if [ -n "$placeholders" ]; then
            echo "Refusing to release: still at the placeholder version 0.0.0:" >&2
            echo "  $placeholders" >&2
            echo "Set the first real version before enabling the release workflow." >&2
            exit 1
          fi

      # Every guard above runs before the install and the build, so a run that
      # cannot possibly reach a good publish fails in seconds rather than after
      # the full graph has been built.
      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      # `lib/` is build output and is not committed, so `packages/cli/lib/cli.js`
      # is absent when `npm ci` runs and npm SILENTLY skips a workspace `bin`
      # symlink whose target is missing. The first example to invoke
      # `hydranium-cli` in its `generate` step then dies with exit 127, naming
      # that example rather than the link that was never made — so the failure
      # points at the example's grammar tooling and not at the install.
      #
      # Building first gives the symlink a target; the second install is what
      # creates it. It cannot be collapsed into one step: npm offers no hook
      # between dependency installation and workspace `prepare`, which is why
      # the two-step is permanent rather than a bug awaiting a fix.
      # `tsc -b`, and NOT a filtered turbo run, which was tried and measured
      # worse: the `build:all` behind this one still reported `0 cached` — the
      # install between them changes what turbo hashes — so nothing was reused
      # and the step itself went 12s to 31s on turbo's overhead alone. Whatever
      # this step costs is paid twice by construction; keep it the cheap one.
      - name: Build the framework packages
        run: npm run build

      - name: Link the workspace bins
        run: npm install --no-fund --no-audit

      - name: Build
        run: npm run build:all

      # The whole contributor gate, in THIS workflow, before the publish step.
      # The alternatives were weighed and rejected: `workflow_run` resolves the
      # workflow file from the default branch rather than the pushed commit and
      # needs its own conclusion check, so a CI run that was skipped or
      # cancelled silently blocks every release; and folding this job into
      # ci.yml with `needs:` rewrites both files to buy the same property.
      # Nothing else can supply it — CI runs on the same trigger with no
      # dependency either way, so the two RACE, and a red gate over there
      # cannot stop what happens below. The duplicated run is cheap: the build
      # above populates the turbo cache this reuses.
      - name: Full gate
        run: npm run check

      # `--tag alpha` on the publish is a PRECONDITION of the first release, not
      # a refinement after it. The release line starts at 1.0.0 — under `fixed`
      # versioning plus caret peer ranges a 0.x line cannot take a minor bump at
      # all — so the version number can no longer carry the alpha signal, and
      # semver reads 1.0.0 as stable. `changeset publish` always passes a `--tag`
      # through to `npm publish` and defaults it to `latest`, so leaving the flag
      # off does not mean "no tag": it means the alpha is what a bare
      # `npm install @hydranium/core` resolves. A dist-tag can be moved
      # afterwards; a version already served from `latest` cannot be recalled,
      # which is why this lives in the workflow and not only in the runbook.
      #
      # It does NOT make the first publish safe on its own. npmjs.org assigns
      # `latest` to the first version of a new package in addition to the
      # requested tag, so 1.0.0 lands on both `alpha` and `latest` and `latest`
      # has to be moved by hand afterwards (see docs/contributing/releasing.md). What the flag
      # buys is the `alpha` tag existing at all, and every publish after the
      # first staying off `latest`. Drop it in the same change that moves
      # `latest` deliberately, never before.
      - name: Create Release PR or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npx changeset version
          publish: npx changeset publish --tag alpha
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

# The shared builders in `@hydranium/core/testing` and `@hydranium/glsp-server/testing`
# replace per-file copies; a local declaration under a canonical name brings a copy back.
# A renamed copy escapes this rule.
id: test-fixture-builder-function
language: typescript
severity: error
message: Import the shared makeFake* / makeNoop* / makeCapturing* helpers from @hydranium/core/testing (or @hydranium/glsp-server/testing for the GLSP ones) instead of re-declaring a local fixture builder (see docs/contributing/conventions.md “Test support”).
files:
  - packages/**/test/**/*.ts
rule:
  any:
    - kind: function_declaration
    - kind: generator_function_declaration
  has:
    field: name
    regex: ^(fakeNode|makeNode|fakeReflection|makeDescription|makeNoopLogger|makeCapturingLogger|makeNoopTracer|makeCapturingTracer|makeNoopSharedServices|makeNoopLanguageServices|makeNoopGlspLogger|makeCapturingGlspLogger)$
---
id: test-fixture-builder-variable
language: typescript
severity: error
message: Import the shared makeFake* / makeNoop* / makeCapturing* helpers from @hydranium/core/testing (or @hydranium/glsp-server/testing for the GLSP ones) instead of re-declaring a local fixture builder (see docs/contributing/conventions.md “Test support”).
files:
  - packages/**/test/**/*.ts
rule:
  kind: variable_declarator
  all:
    - has:
        field: name
        regex: ^(fakeNode|makeNode|fakeReflection|makeDescription|makeNoopLogger|makeCapturingLogger|makeNoopTracer|makeCapturingTracer|makeNoopSharedServices|makeNoopLanguageServices|makeNoopGlspLogger|makeCapturingGlspLogger)$
    - has:
        field: value
        any:
          - kind: arrow_function
          - kind: function_expression
          - kind: generator_function
